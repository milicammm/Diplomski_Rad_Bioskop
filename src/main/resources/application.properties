# APPLICATION INFO
spring.application.name=CineTicket
server.port=8081


# DATABASE CONFIGURATION
spring.datasource.url=jdbc:postgresql://localhost:5432/cineticket
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Defer DataSource initialization until after JPA has created the schema
spring.jpa.defer-datasource-initialization=true

# SQL DATA INITIALIZATION
spring.sql.init.data-locations=classpath:db/migration/V2__data.sql
spring.sql.init.mode=always


# JWT CONFIGURATION
app.jwt.secret=CineTicketSecretKeyForJWTTokenGenerationAndValidation2026ThisMustBeLongEnough
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000


# STRIPE CONFIGURATION
app.stripe.api.key=YOUR_STRIPE_API_KEY_HERE
app.stripe.webhook.secret=YOUR_STRIPE_WEBHOOK_SECRET_HERE
app.stripe.success.url=http://localhost:4200/payment/success
app.stripe.cancel.url=http://localhost:4200/payment/cancel


# CORS CONFIGURATION
app.cors.allowed-origins=http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# FILE UPLOAD CONFIGURATION
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# LOGGING CONFIGURATION
logging.level.root=INFO
logging.level.com.cineticket=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# SWAGGER/OPENAPI CONFIGURATION
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# APPLICATION INFO
spring.application.name=CineTicket
server.port=8081

# Local secrets (Stripe keys, JWT secret, mail password) live in application-local.properties,
# which is gitignored and picked up automatically from the project root when present.
spring.profiles.active=local


# DATABASE CONFIGURATION
spring.datasource.url=jdbc:postgresql://localhost:5432/cineticket
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Defer DataSource initialization until after JPA has created the schema
spring.jpa.defer-datasource-initialization=true

# SQL DATA INITIALIZATION
spring.sql.init.data-locations=classpath:db/migration/V2__data.sql
spring.sql.init.mode=always
# V2__data.sql is a single PL/pgSQL DO block; ";;" (not ";") marks the end of the script
# so Spring doesn't split on the semicolons inside the block.
spring.sql.init.separator=;;


# ORDER RESERVATION
# How long a PENDING order holds its seats before the scheduler releases them.
app.order.reservation-minutes=15
app.order.expiration-check-interval-ms=60000

# JWT CONFIGURATION
app.jwt.secret=YOUR_JWT_SECRET_HERE
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000


# STRIPE CONFIGURATION
app.stripe.api.key=YOUR_STRIPE_API_KEY_HERE
app.stripe.webhook.secret=YOUR_STRIPE_WEBHOOK_SECRET_HERE
app.stripe.success.url=http://localhost:4200/payment/success
app.stripe.cancel.url=http://localhost:4200/payment/cancel


# CORS CONFIGURATION
app.cors.allowed-origins=http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# FILE UPLOAD CONFIGURATION
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# EMAIL CONFIGURATION
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=noreply@cineticket.com

# TICKET CONFIGURATION
app.ticket.storage.path=tickets
app.ticket.verify.url=http://localhost:4200/verify-ticket

# LOGGING CONFIGURATION
logging.level.root=INFO
logging.level.com.cineticket=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# SWAGGER/OPENAPI CONFIGURATION
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
